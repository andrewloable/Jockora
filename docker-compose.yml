#
# Portable quickstart: builds from this checkout, needs nothing but a music
# folder and a GGUF. Published on LOCALHOST ONLY, because Jockora has no
# authentication whatsoever.
#
#   MUSIC=/path/to/music MODEL=qwen2.5-7b-instruct-q4_k_m.gguf docker compose up -d
#
# The house deployment, which is not portable, lives in deploy/.

services:
  llm:
    # Pinned by digest-bearing tag rather than :latest, so a rebuild months from
    # now produces the same station rather than a surprise.
    image: ghcr.io/ggml-org/llama.cpp:server-b4738
    restart: unless-stopped
    volumes:
      # Put your .gguf here. Nothing is downloaded for you: a language model is
      # an operator-supplied dependency, like ffmpeg.
      - ${MODELS:-./models}:/models:ro
    command:
      - "-m"
      - "/models/${MODEL:?set MODEL to the .gguf filename inside your models directory}"
      - "--host"
      - "0.0.0.0"
      - "--port"
      - "8080"
      - "-c"
      - "8192"
    healthcheck:
      # Jockora's own preflight refuses to serve without a working model, so
      # letting it start first would just produce a confusing failure.
      test: ["CMD-SHELL", "curl -sf http://127.0.0.1:8080/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 120s

  jockora:
    build: .
    restart: unless-stopped
    depends_on:
      llm:
        condition: service_healthy
    ports:
      # 127.0.0.1 ON PURPOSE. THERE IS NO AUTHENTICATION: anyone who can reach
      # this port can listen to your stream and read /now.json. Change this to
      # 0.0.0.0 only if you have decided that is what you want, and never
      # port-forward it to the internet.
      - "127.0.0.1:8080:8080"
    environment:
      JOCKORA_LISTEN_ADDR: "0.0.0.0:8080"
      # Required because the line above is non-loopback INSIDE the container.
      # The published port above is what keeps it off your network.
      JOCKORA_ALLOW_LAN: "1"
      JOCKORA_LIBRARY_PATH: "/music"
      JOCKORA_LLM_URL: "http://llm:8080"
      JOCKORA_PERSONA: "/app/personas"
    volumes:
      # READ-ONLY, enforced by the mount rather than promised by the code.
      # Jockora layers on top of a library you already have and must never
      # become a competing writer.
      - ${MUSIC:?set MUSIC to your music folder}:/music:ro
      # Holds the database and the Kokoro voice models. MUST BE OWNED BY UID
      # 10001: the container is unprivileged and cannot chown a bind mount from
      # inside. This is the most common first-run failure, and `jockora doctor`
      # names the exact fix if you hit it.
      - ${CONFIG:-./config}:/config
      - ${CONFIG:-./config}/models:/models:ro
    tmpfs:
      # Segments are rewritten every few seconds and never need to survive a
      # restart.
      # mode=1777 is REQUIRED. A tmpfs mounts root-owned, the container runs
      # as uid 10001, and the segment directory is a HARD preflight check --
      # without this the station refuses to start with "permission denied".
      - /tmp/segments:size=1g,mode=1777
    command: ["serve"]
