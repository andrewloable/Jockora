#
# Deployment for gsc-datacenter (192.168.0.254), following the conventions
# already in use on that host: 420xx port slots, one shared user-defined bridge,
# restart=always, config under /home/mandark/<service>.

services:
  jockora:
    image: 192.168.0.254:42009/jockora:latest
    container_name: jockora
    restart: always
    networks:
      - server-network
    ports:
      # 42017 is the next free slot in the house 420xx range (42000-42016 taken).
      #
      # Published on 0.0.0.0 per house convention, WHICH MEANS THE WHOLE LAN CAN
      # REACH IT. Jockora ships no authentication: anyone on the network can
      # listen to the stream and read /now.json. That is a deliberate decision
      # taken on 2026-09-06, not a default -- the binary refuses a non-loopback
      # bind unless JOCKORA_ALLOW_LAN is set, and it warns on every start.
      #
      # Note the cloudflared tunnel on this host is REMOTELY MANAGED: a public
      # hostname can be pointed at this service from the Cloudflare dashboard
      # without changing anything here. Do not add one until accounts land.
      - "42017:8080"
    environment:
      JOCKORA_LISTEN_ADDR: "0.0.0.0:8080"
      JOCKORA_ALLOW_LAN: "1"
      JOCKORA_LIBRARY_PATH: "/music"
      JOCKORA_SEGMENT_DIR: "/tmp/segments"
      JOCKORA_DB_PATH: "/config/jockora.db"
      # llama-server runs on the host, not in this container: it is an
      # operator-supplied service, and the P400's 2GB will not hold a 4B model
      # so inference is CPU-bound anyway.
      JOCKORA_LLM_URL: "http://172.20.0.1:8081"
    volumes:
      # READ-ONLY, and enforced twice: Jockora never writes to a music library
      # by design, and the mount makes it impossible rather than merely
      # promised. It layers on top of Jellyfin here; it must never become a
      # competing writer.
      - /media/data1/music:/music:ro
      - /home/mandark/jockora:/config
    tmpfs:
      # Segments are rewritten every few seconds and never need to survive a
      # restart. Keeping them in RAM avoids pointless disk churn on the SSD.
      - /tmp/segments:size=512m
    command:
      # `serve` is required as of the five-subcommand CLI (Jockora-mf3.4).
      # Without it the binary prints usage and exits 2.
      - "serve"
      - "-break"
      - "/config/voice.wav"
      - "-break-at"
      - "45"
      - "-break-every"
      # ROOM TEST A wants a break the listener meets naturally, not a metronome.
      # Every 4 minutes is roughly real radio cadence: often enough that an
      # unbriefed person in the room will hit several, rare enough that it does
      # not read as a gimmick.
      - "240"
      - "/music"

networks:
  server-network:
    external: true
