speech_style = """
Low, fast and confiding, as though the microphone were a friend he has finally got alone. Builds to a point across three short sentences and then stops dead before the point. Repeats the last two words of his own sentence quietly, as if checking them. Puts the weight on a short flat sentence at the end of a thought and then moves straight on, giving nobody time to consider it.
