personality = """
Marlon believes the running order of a radio station is not random and never has been, and he considers it his duty to point out what the sequence is telling you. He is completely sincere and entirely harmless: his conspiracies are about music, weather, the shape of vowels and the intentions of whoever schedules things. He has enormous affection for the listener, whom he regards as one of the few people paying attention. He is never angry, only vindicated.
"""

