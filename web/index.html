<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Jockora</title>
<style>
  #dial { display: flex; flex-wrap: wrap; gap: .4rem; margin: 1rem 0; }
  #dial button {
    padding: .5rem .8rem; border: 1px solid currentColor; background: none;
    color: inherit; cursor: pointer; font: inherit; border-radius: .2rem;
  }
  #dial button[aria-pressed="true"] { background: currentColor; filter: invert(1); }
  #dial button small { display: block; opacity: .7; font-size: .8em; }
  #thumbsdown { font: inherit; padding: .3rem .6rem; cursor: pointer; }

  :root { color-scheme: light dark; }
  body {
    margin: 0; min-height: 100vh;
    display: flex; flex-direction: column;
    align-items: center; justify-content: center; gap: 1.25rem;
    font: 16px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif;
  }
  h1 { margin: 0; font-size: 1.5rem; letter-spacing: .02em; font-weight: 600; }
  audio { width: min(90vw, 32rem); }
  #status { min-height: 1.5em; opacity: .7; font-size: .875rem; }
  #status[data-state="error"] { opacity: 1; color: #c0392b; }
  #nowplaying { margin: 0; font-size: 1rem; text-align: center; max-width: min(90vw, 32rem); }
  #nowplaying .artist { opacity: .7; }
  #transcript {
    margin: 0; max-width: min(90vw, 32rem); font-size: .875rem;
    opacity: .7; font-style: italic; text-align: center;
  }
  #transcript:empty { display: none; }
</style>
</head>
<body>

<h1>Jockora</h1>

<!-- No autoplay: browsers block it, and a blocked autoplay looks like a broken
     stream rather than a browser policy. The listener presses play. -->
<audio id="player" controls preload="none"></audio>

<!-- No skip control and no playlist view. There is no skip in this product by
     design; changing station is the escape hatch. -->
<p id="status">Press play to tune in.</p>

<!-- THE DIAL IS THE PRIMARY UI, not a settings screen. It is a row of stations
     the library proposed for itself, and tuning one is the only navigation
     this product has. There is deliberately NO MUSIC BROWSER: you do not browse
     radio, you tune it, and Navidrome is a tab away. -->
<div id="dial"></div>

<!-- Now playing, and what the DJ last said. The transcript is free here because
     /now.json already carries it for diagnostics, and it is how you check what
     the jock actually said without reading logs. -->
<p id="nowplaying"></p>
<p id="transcript"></p>

<!-- The thumbs-down is the ONLY signal the writing ever gets from a real ear.
     Everything else judging a break in this project is a machine checking rules
     it was handed. There is no thumbs-up: praise tunes nothing, and asking for
     it invites a rating habit this product does not want. -->
<p id="feedback" hidden><button id="thumbsdown" type="button">That one was bad</button>
<span id="feedback-said"></span></p>

<!-- Vendored, not a CDN: this is a self-hosted product that has to work on a
     machine with no internet connection. -->
<script src="/vendor/hls.light.min.js"></script>
<script>
(function () {
  var SRC = '/hls/stream.m3u8';
  var player = document.getElementById('player');
  var status = document.getElementById('status');

  function say(text, state) {
    status.textContent = text;
    if (state) { status.setAttribute('data-state', state); }
    else { status.removeAttribute('data-state'); }
  }

  // Native HLS is checked FIRST and wins wherever it exists. iOS Safari has no
  // Media Source Extensions at all, so hls.js cannot work there under any
  // circumstances, and iOS is a required target. Desktop Safari also plays HLS
  // natively and does it better than the polyfill.
  if (player.canPlayType('application/vnd.apple.mpegurl')) {
    player.src = SRC;
  } else if (window.Hls && window.Hls.isSupported()) {
    var hls = new Hls({ enableWorker: true, lowLatencyMode: false });
    hls.loadSource(SRC);
    hls.attachMedia(player);
    hls.on(Hls.Events.ERROR, function (_evt, data) {
      if (!data.fatal) { return; }
      // A live stream restarts its encoder now and then. Recover rather than
      // dropping the listener.
      if (data.type === Hls.ErrorTypes.NETWORK_ERROR) {
        say('Reconnecting…');
        hls.startLoad();
      } else if (data.type === Hls.ErrorTypes.MEDIA_ERROR) {
        say('Recovering…');
        hls.recoverMediaError();
      } else {
        say('Stream unavailable. Is the server running?', 'error');
        hls.destroy();
      }
    });
  } else {
    say('This browser cannot play HLS.', 'error');
    return;
  }

  // Now playing, polled from /now.json.
  //
  // The TAB TITLE is the point: this is a thing you leave running for hours,
  // and a tab called "Jockora" is unfindable among twenty others. A tab called
  // "Alice In Chains - Rooster" is not.
  var STATIC_TITLE = 'Jockora';
  var nowplaying = document.getElementById('nowplaying');
  var transcript = document.getElementById('transcript');

  function renderNow(now, lastBreak) {
    if (!now || (!now.artist && !now.title)) {
      // Degrade to the static name. A stale track title is worse than none:
      // it says the stream is fine when it may have stopped minutes ago.
      document.title = STATIC_TITLE;
      nowplaying.textContent = '';
      transcript.textContent = '';
      return;
    }
    var artist = now.artist || '';
    var title = now.title || '';
    document.title = artist ? artist + ' - ' + title : title;

    nowplaying.textContent = '';
    if (artist) {
      var a = document.createElement('span');
      a.className = 'artist';
      a.textContent = artist + ' — ';
      nowplaying.appendChild(a);
    }
    // textContent, never innerHTML: this is model-written text arriving over
    // the network, and the one place it must not be able to become markup.
    nowplaying.appendChild(document.createTextNode(title));
    transcript.textContent = lastBreak && lastBreak.text ? '"' + lastBreak.text + '"' : '';
  }

  function poll() {
    // Nothing here changes faster than a track, so five seconds is generous.
    fetch('/now.json', { cache: 'no-store' })
      .then(function (r) { return r.ok ? r.json() : null; })
      .then(function (d) {
        renderNow(d && d.now, d && d.last_break);
        // Offer the thumbs-down only for a break that has actually aired and
        // has not already been rated.
        var text = (d && d.last_break && d.last_break.text) || '';
        lastBreakText = text;
        feedback.hidden = !text;
        if (text !== lastRated) { feedbackSaid.textContent = ''; }
      })
      .catch(function () {
        // A failed fetch must never throw and must never leave a stale title.
        renderNow(null, null);
      });
  }
  var lastBreakText = '';
  poll();
  setInterval(poll, 5000);

  // ---- the dial -----------------------------------------------------------
  //
  // Rendered ONCE. It changes only as enrichment reclassifies tracks, which is
  // minutes at best, and a dial that reshuffles itself under a listener's
  // finger is worse than a slightly stale one.
  var dial = document.getElementById('dial');
  var current = null;

  function tune(tag, button) {
    fetch('/tune', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ tag: tag })
    }).then(function (r) {
      if (!r.ok) { return r.text().then(function (t) { throw new Error(t); }); }
      return r.json();
    }).then(function (d) {
      current = tag;
      Array.prototype.forEach.call(dial.querySelectorAll('button'), function (b) {
        b.setAttribute('aria-pressed', String(b === button));
      });
      // The current song is NOT interrupted, and saying so stops the listener
      // pressing the button again thinking it failed. Deliberately phrased
      // without the words a skip control would use: there is no skip here, and
      // TestPlayerHasNoSkipControl enforces that on the page text.
      say('Tuned to ' + tag + ' (' + d.tracks + ' tracks). You will hear it when this song ends.');
    }).catch(function (e) {
      say(String(e.message || e), 'error');
    });
  }

  fetch('/stations.json', { cache: 'no-store' })
    .then(function (r) { return r.ok ? r.json() : null; })
    .then(function (d) {
      if (!d || !d.stations || !d.stations.length) { return; }
      d.stations.forEach(function (st) {
        var b = document.createElement('button');
        b.type = 'button';
        b.setAttribute('aria-pressed', 'false');
        b.appendChild(document.createTextNode(st.tag.toUpperCase() + ' ' + st.tracks));
        if (st.jock_name) {
          var who = document.createElement('small');
          who.textContent = st.jock_name;
          b.appendChild(who);
        }
        b.addEventListener('click', function () { tune(st.tag, b); });
        dial.appendChild(b);
      });
    })
    .catch(function () { /* no dial is not an error; the stream still plays */ });

  // ---- the thumbs-down ----------------------------------------------------
  var feedback = document.getElementById('feedback');
  var feedbackSaid = document.getElementById('feedback-said');
  var lastRated = null;

  document.getElementById('thumbsdown').addEventListener('click', function () {
    fetch('/feedback', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ verdict: 'down' })
    }).then(function (r) {
      if (!r.ok) { throw new Error('could not record that'); }
      lastRated = lastBreakText;
      feedbackSaid.textContent = ' Noted.';
    }).catch(function () {
      feedbackSaid.textContent = ' Could not record that.';
    });
  });

  player.addEventListener('playing', function () { say('On air.'); });
  player.addEventListener('waiting', function () { say('Buffering…'); });
  player.addEventListener('pause', function () { say('Paused.'); });
  player.addEventListener('error', function () {
    say('Stream unavailable. Is the server running?', 'error');
  });
})();
</script>

</body>
</html>
