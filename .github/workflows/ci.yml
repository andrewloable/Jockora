name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v6
        with:
          go-version: '1.25'
          check-latest: true

      # ffmpeg and ffprobe are operator-supplied at runtime and required by the
      # decode, encode, library and app tests. They are installed here, never
      # vendored, and never linked: see LICENCES-MANUAL.md.
      - name: Install ffmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Build
        run: go build ./...

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test -race ./...

  gates:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v6
        with:
          go-version: '1.25'
          check-latest: true

      # Each of these fails the build. None of them is a warning.
      - name: Licence gate
        run: bash scripts/check-licences.sh

      - name: SPDX header gate
        run: bash scripts/check-headers.sh

      - name: Cross-compile gate
        run: bash scripts/check-crosscompile.sh

      # Build-tagged tests are never compiled by `go test ./...`, so they rot
      # silently: the soak harness can stop building against the code it tests
      # and nothing says so until someone tries to run a 24-hour measurement
      # and it fails in the first second. Compiling is cheap; running it here
      # is not, and is not the point.
      - name: Build-tagged tests still compile
        run: go vet -tags soak ./test/soak/

  # ---------------------------------------------------------------------------
  # Release. Tag-only, and it runs AFTER the gates: a tag that fails the licence
  # check must not produce a downloadable artifact, because that artifact is the
  # thing someone else redistributes.
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [test, gates]
    runs-on: ubuntu-latest
    permissions:
      contents: write   # create the release
      packages: write   # push to GHCR
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v6
        with:
          go-version: '1.25'
          check-latest: true

      # CGO_ENABLED=0 on every target. This is not a preference: the SQLite
      # driver is modernc.org/sqlite precisely so these binaries are static, and
      # the cross-compile gate above already proves the tree builds this way.
      - name: Build static binaries
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME}"
          mkdir -p dist
          for target in linux/amd64 linux/arm64 darwin/arm64; do
            os="${target%/*}"; arch="${target#*/}"
            name="jockora-${version}-${os}-${arch}"
            CGO_ENABLED=0 GOOS="$os" GOARCH="$arch" \
              go build -trimpath -ldflags="-s -w -X main.Version=${version}" \
              -o "dist/${name}/jockora" ./cmd/jockora
            # The sidecar and the jocks travel WITH the binary. A release whose
            # persona directory is empty produces a station that plays music and
            # never speaks, which is a failure this deployment has already had.
            cp -r sidecar personas "dist/${name}/"
            # Build litter, not product. Shipping it is harmless but sloppy, and
            # a stale .pyc for the wrong interpreter is worse than harmless.
            rm -rf "dist/${name}/sidecar/__pycache__"
            cp README.md LICENSING.md LICENCES-MANUAL.md "dist/${name}/"
            tar -C dist -czf "dist/${name}.tar.gz" "${name}"
            rm -rf "dist/${name:?}"
          done
          cd dist && sha256sum *.tar.gz > checksums.txt
          cat checksums.txt

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push the image
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/${{ github.repository }}:${{ github.ref_name }}
            ghcr.io/${{ github.repository }}:latest

      - name: Publish the release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.tar.gz
            dist/checksums.txt
          generate_release_notes: true
          body: |
            ## Install

                docker pull ghcr.io/${{ github.repository }}:${{ github.ref_name }}

            Or take a `.tar.gz` below. The binaries are static
            (`CGO_ENABLED=0`) and carry the speech sidecar and the jocks.
            **ffmpeg is not included in the archives** — install it yourself, or
            use the image, which has it.

            Verify with `sha256sum -c checksums.txt`.

            ## Licensing

            Jockora is **AGPL-3.0-only**, with a commercial exception available;
            see `LICENSING.md`.

            **The container image ships GPL ffmpeg alongside the AGPL-3.0-only
            binary. That is MERE AGGREGATION under GPL section 5, not a combined
            work**: ffmpeg is executed as a separate process and is never
            linked. This is a deliberate, documented finding — see
            `LICENCES-MANUAL.md` — recorded here so a commercial-exception buyer
            reads it up front rather than discovering it later.
