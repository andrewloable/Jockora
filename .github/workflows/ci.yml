name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v6
        with:
          go-version: '1.25'
          check-latest: true

      # ffmpeg and ffprobe are operator-supplied at runtime and required by the
      # decode, encode, library and app tests. They are installed here, never
      # vendored, and never linked: see LICENCES-MANUAL.md.
      - name: Install ffmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - uses: actions/setup-node@v6
        with:
          node-version: lts/*
          cache: npm
          cache-dependency-path: web/app/package-lock.json

      # The browser app is tested and built BEFORE the Go build, because the Go
      # build embeds its output: web/dist is gitignored, so a job that skipped
      # this would compile a binary that serves the "assets not built" notice.
      - name: Install the browser app
        run: cd web/app && npm ci

      # 100% thresholds, the same rule the Go side is held to. The build fails
      # here, not in review.
      - name: Test the browser app
        run: cd web/app && npx ng test --watch=false

      - name: Build the browser app
        # ng build CLEANS its output directory, taking web/dist/.gitkeep with
        # it -- the file that makes `//go:embed all:dist` legal. `make web`
        # restores it locally; this step is that same restore for CI.
        run: |
          cd web/app && npx ng build --configuration production
          touch ../dist/.gitkeep

      - name: Build
        run: go build ./...

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test -race ./...

  gates:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v6
        with:
          go-version: '1.25'
          check-latest: true

      - uses: actions/setup-node@v6
        with:
          node-version: lts/*
          cache: npm
          cache-dependency-path: web/app/package-lock.json

      # The node licence gate SKIPS when node_modules is absent, which would
      # make it a gate that never runs. Installing is what makes it real.
      - name: Install the browser app
        run: cd web/app && npm ci

      # Each of these fails the build. None of them is a warning.
      - name: Licence gate
        run: bash scripts/check-licences.sh

      # The Angular bundle is embedded in the binary and served to every
      # listener, so npm dependencies are inside the dual-licensing constraint
      # exactly as Go modules are.
      - name: Node licence gate
        run: bash scripts/check-licences-node.sh

      - name: SPDX header gate
        run: bash scripts/check-headers.sh

      - name: Cross-compile gate
        run: bash scripts/check-crosscompile.sh

      # Build-tagged tests are never compiled by `go test ./...`, so they rot
      # silently: the soak harness can stop building against the code it tests
      # and nothing says so until someone tries to run a 24-hour measurement
      # and it fails in the first second. Compiling is cheap; running it here
      # is not, and is not the point.
      - name: Build-tagged tests still compile
        run: |
          go vet -tags soak ./test/soak/
          go vet -tags gates ./test/
          go vet -tags docker ./test/

  # ---------------------------------------------------------------------------
  # Release. Tag-only, and it runs AFTER the gates: a tag that fails the licence
  # check must not produce a downloadable artifact, because that artifact is the
  # thing someone else redistributes.
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [test, gates]
    runs-on: ubuntu-latest
    permissions:
      contents: write   # create the release
      packages: write   # push to GHCR
    steps:
      - uses: actions/checkout@v5

      # THE TAG IS THE VERSION, OR NOTHING SHIPS.
      #
      # Three places state it and nothing forced them to agree: the git tag
      # becomes the image tag AND is stamped into the binary with -X, while the
      # console is built from package.json's version. Tag v0.9.0 on a tree that
      # says 0.2.0 and you get a binary calling itself v0.9.0 beside a console
      # built as 0.2.0, an image tagged for neither, and no failure anywhere.
      #
      # test/version_test.go holds main.go and package.json together but cannot
      # see the tag. This is the half that can, and it runs before anything is
      # built so a mismatched tag costs seconds rather than a published image
      # somebody has to go and delete.
      - name: The tag must match the version in the tree
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME#v}"
          go_version=$(sed -n 's/^var Version = "\(.*\)"$/\1/p' cmd/jockora/main.go)
          # sed rather than node: this step runs BEFORE setup-node, and the
          # runner's preinstalled node is not something to depend on.
          web_version=$(sed -n 's/^  "version": "\(.*\)",$/\1/p' web/app/package.json)
          echo "tag=${tag} main.go=${go_version} package.json=${web_version}"
          if [ "$tag" != "$go_version" ] || [ "$tag" != "$web_version" ]; then
            echo "::error::tag ${GITHUB_REF_NAME} does not match the declared version. Set cmd/jockora/main.go var Version and web/app/package.json version to ${tag}, or tag v${go_version}."
            exit 1
          fi

      - uses: actions/setup-go@v6
        with:
          go-version: '1.25'
          check-latest: true

      # CGO_ENABLED=0 on every target. This is not a preference: the SQLite
      # driver is modernc.org/sqlite precisely so these binaries are static, and
      # the cross-compile gate above already proves the tree builds this way.
      - uses: actions/setup-node@v6
        with:
          node-version: lts/*
          cache: npm
          cache-dependency-path: web/app/package-lock.json

      # BEFORE the binaries, which embed the result. A release built without
      # this ships the "assets not built" notice to everyone who downloads it,
      # and the tarball is the thing other people redistribute.
      - name: Build the browser app
        run: make web

      - name: Build static binaries
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME}"
          mkdir -p dist
          for target in linux/amd64 linux/arm64 darwin/arm64; do
            os="${target%/*}"; arch="${target#*/}"
            name="jockora-${version}-${os}-${arch}"
            CGO_ENABLED=0 GOOS="$os" GOARCH="$arch" \
              go build -trimpath -ldflags="-s -w -X main.Version=${version}" \
              -o "dist/${name}/jockora" ./cmd/jockora
            # The sidecar and the jocks travel WITH the binary. A release whose
            # persona directory is empty produces a station that plays music and
            # never speaks, which is a failure this deployment has already had.
            cp -r sidecar personas "dist/${name}/"
            # Build litter, not product. Shipping it is harmless but sloppy, and
            # a stale .pyc for the wrong interpreter is worse than harmless.
            rm -rf "dist/${name}/sidecar/__pycache__"
            cp README.md LICENSING.md LICENCES-MANUAL.md "dist/${name}/"
            tar -C dist -czf "dist/${name}.tar.gz" "${name}"
            rm -rf "dist/${name:?}"
          done
          cd dist && sha256sum *.tar.gz > checksums.txt
          cat checksums.txt

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # DOCKER HUB IS OPTIONAL AND GHCR IS NOT.
      #
      # These steps used to be unconditional, and they run BEFORE the image
      # build and the GitHub release -- so an unset DOCKERHUB_TOKEN did not cost
      # you Docker Hub, it cost you the whole release: no GHCR image, no
      # tarballs, no release page. Same on any fork, which cannot have the
      # secret at all.
      #
      # GHCR needs no secret: GITHUB_TOKEN is minted for the run. So the
      # publish that always works is the one that always happens, and Docker Hub
      # is added on top when it is configured.
      - name: Work out where this image is published
        id: dockerhub
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
          REPO: ${{ github.repository }}
          REF: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          # LOWERCASE, BECAUSE THE REPOSITORY IS NOT.
          #
          # This repository is andrewloable/Jockora with a capital J, and a
          # Docker repository name must be lowercase -- so ghcr.io/<repo> built
          # straight from github.repository is an invalid tag and buildx refuses
          # the whole build before it pushes anything. Measured, not guessed:
          # the v0.2.0 release failed here with "repository name must be
          # lowercase", after test and gates had both passed.
          #
          # Docker Hub was unaffected because its path is a literal lowercase
          # jockora, which is exactly why this hid until the first real release.
          # tr rather than ${REPO,,}: the bash lowercase expansion needs bash 4,
          # and a construct that works on the runner but not in a shell used to
          # check it is a construct nobody can verify before pushing a tag.
          REPO=$(printf '%s' "$REPO" | tr '[:upper:]' '[:lower:]')
          # THE TAG LIST IS BUILT HERE, not inlined in the action's `tags:`.
          # Composing it there needs an expression that yields an empty line
          # when Docker Hub is unset, and whether the action ignores a blank
          # entry is not something this repository can test. Emitting exactly
          # the lines we mean removes the question.
          {
            echo "tags<<TAGS"
            echo "ghcr.io/${REPO}:${REF}"
            echo "ghcr.io/${REPO}:latest"
            if [ -n "$DOCKERHUB_USERNAME" ] && [ -n "$DOCKERHUB_TOKEN" ]; then
              echo "docker.io/${DOCKERHUB_USERNAME}/jockora:${REF}"
              echo "docker.io/${DOCKERHUB_USERNAME}/jockora:latest"
            fi
            echo "TAGS"
          } >> "$GITHUB_OUTPUT"
          if [ -n "$DOCKERHUB_USERNAME" ] && [ -n "$DOCKERHUB_TOKEN" ]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::warning::DOCKERHUB_USERNAME or DOCKERHUB_TOKEN is unset; publishing to GHCR only."
          fi

      - name: Log in to Docker Hub
        if: steps.dockerhub.outputs.configured == 'true'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push the image
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.dockerhub.outputs.tags }}

      - name: Publish the release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.tar.gz
            dist/checksums.txt
          generate_release_notes: true
          body: |
            ## Install

                docker pull ghcr.io/${{ github.repository }}:${{ github.ref_name }}

            or

                docker pull andrewloable/jockora:${{ github.ref_name }}

            Or take a `.tar.gz` below. The binaries are static
            (`CGO_ENABLED=0`) and carry the speech sidecar and the jocks.
            **ffmpeg is not included in the archives** — install it yourself, or
            use the image, which has it.

            Verify with `sha256sum -c checksums.txt`.

            ## Licensing

            Jockora is **AGPL-3.0-only**, with a commercial exception available;
            see `LICENSING.md`.

            **The container image ships GPL ffmpeg alongside the AGPL-3.0-only
            binary. That is MERE AGGREGATION under GPL section 5, not a combined
            work**: ffmpeg is executed as a separate process and is never
            linked. This is a deliberate, documented finding — see
            `LICENCES-MANUAL.md` — recorded here so a commercial-exception buyer
            reads it up front rather than discovering it later.
